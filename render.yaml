services:
  - type: web
    name: learn-and-grow-hub
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learn-and-grow-db
          property: connectionString

databases:
  - name: learn-and-grow-db
    databaseName: learnandgrow
    user: admin
