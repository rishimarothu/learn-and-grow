<!-- 
TEMPLATE PURPOSE: 
This file is dynamically rendered by FastAPI using Jinja2. 
Variables inside double braces are passed directly from main.py.
Logic inside percent braces controls what the user sees based on their database state.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Update - Learn & Grow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Nunito', sans-serif; background-color: #f3f6fb; }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center shrink-0">
        <a href="/dashboard" class="flex items-center text-gray-500 hover:text-indigo-600 transition">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Dashboard
        </a>
        <div class="font-bold text-lg text-gray-800"><i class="fa-solid fa-pen text-indigo-500 mr-2"></i> Edit Update</div>
    </header>
    
    <main class="flex-1 w-full max-w-3xl mx-auto p-8">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-bold text-[#1e293b] mb-6">Edit Community Update</h2>
            <form action="/api/admin/edit-update/{{ update.id }}" method="POST" enctype="multipart/form-data" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Title</label>
                    <input type="text" name="title" value="{{ update.title }}" required class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Content</label>
                    <textarea name="content" required rows="6" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none">{{ update.content }}</textarea>
                </div>
                <div class="flex space-x-6">
                    <div class="flex-1">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Event Date</label>
                        <input type="date" name="event_date" value="{{ update.event_date }}" required class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Event Time</label>
                        <input type="time" name="event_time" value="{{ update.event_time }}" required class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Replace Image (Leave empty to keep current)</label>
                    {% if update.image_url %}
                    <img src="{{ update.image_url }}" class="w-32 h-24 object-cover rounded mb-2 border">
                    {% endif %}
                    <input type="file" name="image" accept="image/*" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Target Audience</label>
                    <select name="audience" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none appearance-none bg-white">
                        <option value="All Students" {% if update.audience == 'All Students' %}selected{% endif %}>All Students</option>
                        <option value="Mentors Only" {% if update.audience == 'Mentors Only' %}selected{% endif %}>Mentors Only</option>
                        <option value="Computer Science" {% if update.audience == 'Computer Science' %}selected{% endif %}>Computer Science</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition mt-4">
                    Save Changes
                </button>
            </form>
        </div>
    </main>
</body>
</html>
