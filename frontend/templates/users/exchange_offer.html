<!-- 
TEMPLATE PURPOSE: 
This file is dynamically rendered by FastAPI using Jinja2. 
Variables inside double braces are passed directly from main.py.
Logic inside percent braces controls what the user sees based on their database state.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Offer - Student Resource Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f6fb; color: #1e293b; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 w-full max-w-lg">
        <h2 class="text-2xl font-bold mb-2">Offer an Exchange</h2>
        <p class="text-gray-500 mb-6">The owner is requesting <strong>{{ resource.exchange_for }}</strong> in exchange for <strong>{{ resource.title }}</strong>.</p>
        
        <form action="/exchange/offer/{{ resource.id }}" method="POST" enctype="multipart/form-data" class="space-y-6">
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center bg-gray-50 relative hover:bg-gray-100 transition cursor-pointer">
                <input type="file" name="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept=".pdf,.jpg,.jpeg,.png" required>
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-indigo-400 mb-3"></i>
                <p class="font-semibold text-gray-700 text-sm">Upload {{ resource.exchange_for }}</p>
                <p class="text-xs text-gray-500 mt-1">PDF, JPG, PNG up to 10MB</p>
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-md">
                Send Exchange Offer
            </button>
        </form>
    </div>
</body>
</html>
