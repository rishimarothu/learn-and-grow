<!-- 
TEMPLATE PURPOSE: 
This file is dynamically rendered by FastAPI using Jinja2. 
Variables inside double braces are passed directly from main.py.
Logic inside percent braces controls what the user sees based on their database state.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Mentorship Request - Learn & Grow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f6fb; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 w-full max-w-md">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Edit Request</h2>
            <a href="/mentors" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></a>
        </div>
        <form action="/mentors/edit/{{ req.id }}" method="POST">
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Subject / Topic</label>
                <input type="text" name="subject" value="{{ req.subject }}" required class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-purple-500 outline-none">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-1">What exactly do you need help with?</label>
                <textarea name="description" required rows="4" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-purple-500 outline-none resize-none">{{ req.description }}</textarea>
            </div>
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition shadow-sm">Save Changes</button>
        </form>
    </div>

<!-- Auto-updating Notification Badge -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/api/unread-count')
            .then(r => r.json())
            .then(data => {
                const bells = document.querySelectorAll('a[href="/notifications"] span.bg-red-500');
                bells.forEach(b => {
                    if(data.count > 0) {
                        b.style.display = 'flex';
                        b.style.alignItems = 'center';
                        b.style.justifyContent = 'center';
                        b.style.fontSize = '10px';
                        b.style.color = 'white';
                        b.style.fontWeight = 'bold';
                        b.innerText = data.count > 9 ? '9+' : data.count;
                        b.classList.remove('w-2.5', 'h-2.5', 'w-2', 'h-2');
                        b.classList.add('w-5', 'h-5', '-top-2', '-right-2');
                    } else {
                        b.style.display = 'none';
                    }
                });
            })
            .catch(e => console.log('Error fetching notification count:', e));
    });
</script>
</body>
</html>
