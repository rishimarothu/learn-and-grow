<!-- 
TEMPLATE PURPOSE: 
This file is dynamically rendered by FastAPI using Jinja2. 
Variables inside double braces are passed directly from main.py.
Logic inside percent braces controls what the user sees based on their database state.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Resource - Learn & Grow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f6fb; color: #1e293b; overflow: hidden; }
        .sidebar-item { display: flex; align-items: center; padding: 10px 16px; margin: 4px 16px; border-radius: 8px; color: #475569; font-weight: 500; font-size: 14px; transition: all 0.2s; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #1e293b; }
        .sidebar-item i { width: 24px; font-size: 16px; text-align: center; margin-right: 12px; }
        .main-scroll { overflow-y: auto; height: 100vh; padding-bottom: 40px; }
    </style>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        html.dark { filter: invert(1) hue-rotate(180deg); background: #0a0a0a; }
        html.dark img, html.dark video { filter: invert(1) hue-rotate(180deg); }
    </style>

</head>
<body class="flex h-screen">

<!-- Sidebar (Minified for brevity) -->
<aside id="mobile-sidebar" class="w-64 bg-white shadow-[2px_0_15px_rgba(0,0,0,0.02)] flex flex-col z-50 shrink-0 absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300">
    
    <button onclick="document.getElementById('mobile-sidebar').classList.add('-translate-x-full')" class="md:hidden absolute top-4 right-4 text-gray-500 hover:text-gray-700 z-50"><i class="fa-solid fa-xmark text-2xl"></i></button>
    <div class="py-8 px-6 flex flex-col items-center justify-center">
        <div class="text-green-500 text-4xl mb-2"><i class="fa-solid fa-leaf"></i></div>
        <h1 class="text-xl font-bold text-center leading-tight">Student<br>Resource Hub</h1>
    </div>
    <nav class="flex-1 overflow-y-auto">
        <a href="/dashboard" class="sidebar-item"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </nav>
</aside>

<!-- Main Content -->
<main class="flex-1 flex flex-col main-scroll relative">
    <!-- Mobile Top Bar -->
    <div class="md:hidden bg-white shadow-sm p-4 flex items-center justify-between z-40 sticky top-0 shrink-0">
        <div class="font-bold text-lg text-gray-800 flex items-center"><i class="fa-solid fa-leaf text-green-500 mr-2"></i> Resource Hub</div>
        <button onclick="document.getElementById('mobile-sidebar').classList.remove('-translate-x-full')" class="text-gray-600 focus:outline-none">
            <i class="fa-solid fa-bars text-2xl"></i>
        </button>
    </div>

    <header class="flex justify-between items-center py-6 px-10 sticky top-0 bg-[#f3f6fb]/90 backdrop-blur-sm z-10">
        <h2 class="text-2xl font-bold text-gray-800">Edit Resource</h2>
        <a href="/dashboard" class="text-indigo-600 font-semibold text-sm hover:underline">Back to Dashboard</a>
    </header>
    
    <div class="px-10 pb-10 flex justify-center">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 w-full max-w-2xl">
            
              <h3 class="text-xl font-bold mb-6">What are you sharing today?</h3>
            <form action="/edit-resource/{{ resource.id }}" method="POST" enctype="multipart/form-data" class="space-y-6">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Title</label>
                        <input type="text" name="title" required placeholder="e.g., Operating Systems Book" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
                        <select name="category" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="Notes" {% if resource.category == "Notes" %}selected{% endif %}>Notes (PDF/Handwritten)</option>
                            <option value="Book" {% if resource.category == "Book" %}selected{% endif %}>Textbook</option>
                            <option value="Equipment">Lab Equipment / Accessories</option>
                            <option value="Other" {% if resource.category == "Other" %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
                    <textarea name="description" required rows="3" placeholder="Briefly describe what this is..." class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Type of Listing</label>
                    <div class="grid grid-cols-3 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="resource_type" value="donate" class="peer sr-only" {% if resource.resource_type == "donate" %}checked{% endif %} onchange="toggleFields()">
                            <div class="text-center p-3 border-2 border-gray-200 rounded-xl peer-checked:border-red-500 peer-checked:bg-red-50 transition">
                                <i class="fa-solid fa-heart text-red-500 mb-1 block text-lg"></i>
                                <span class="font-bold text-sm text-gray-700">Free Resource</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="resource_type" value="rent" class="peer sr-only" {% if resource.resource_type == "rent" %}checked{% endif %} onchange="toggleFields()">
                            <div class="text-center p-3 border-2 border-gray-200 rounded-xl peer-checked:border-green-500 peer-checked:bg-green-50 transition">
                                <i class="fa-solid fa-right-left text-green-500 mb-1 block text-lg"></i>
                                <span class="font-bold text-sm text-gray-700">Rent</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="resource_type" value="exchange" class="peer sr-only" {% if resource.resource_type == "exchange" %}checked{% endif %} onchange="toggleFields()">
                            <div class="text-center p-3 border-2 border-gray-200 rounded-xl peer-checked:border-indigo-500 peer-checked:bg-indigo-50 transition">
                                <i class="fa-solid fa-rotate text-indigo-500 mb-1 block text-lg"></i>
                                <span class="font-bold text-sm text-gray-700">Exchange</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Dynamic Fields -->
                <div id="rent-fields" class="hidden bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Price per day</label>
                    <input type="text" name="price_per_day" value="{{ resource.price_per_day or 0 }}" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm outline-none">
                </div>

                <div id="exchange-fields" class="hidden bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">What do you want in exchange?</label>
                    <input type="text" name="exchange_for" value="{{ resource.exchange_for or '' }}" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm outline-none">
                </div>

                <!-- File Upload -->
                <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center bg-gray-50 relative hover:bg-gray-100 transition cursor-pointer">
                    <input type="file" name="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept=".pdf,.jpg,.jpeg,.png" required>
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-indigo-400 mb-3"></i>
                    <p class="font-semibold text-gray-700 text-sm">Click to upload or drag and drop</p>
                    <p class="text-xs text-gray-500 mt-1">PDF, JPG, PNG up to 10MB</p>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-md">
                    Post Resource
                </button>
            </form>
        </div>
    </div>
</main>

<script>
    function toggleFields() {
        const type = document.querySelector('input[name="resource_type"]:checked').value;
        const rentFields = document.getElementById('rent-fields');
        const exchangeFields = document.getElementById('exchange-fields');
        
        rentFields.classList.add('hidden');
        exchangeFields.classList.add('hidden');
        
        if (type === 'rent') rentFields.classList.remove('hidden');
        if (type === 'exchange') exchangeFields.classList.remove('hidden');
    }
</script>
<script>document.addEventListener("DOMContentLoaded", toggleFields);</script>
<!-- Auto-updating Notification Badge -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/api/unread-count')
            .then(r => r.json())
            .then(data => {
                const bells = document.querySelectorAll('a[href="/notifications"] span.bg-red-500');
                bells.forEach(b => {
                    if(data.count > 0) {
                        b.style.display = 'flex';
                        b.style.alignItems = 'center';
                        b.style.justifyContent = 'center';
                        b.style.fontSize = '10px';
                        b.style.color = 'white';
                        b.style.fontWeight = 'bold';
                        b.innerText = data.count > 9 ? '9+' : data.count;
                        b.classList.remove('w-2.5', 'h-2.5', 'w-2', 'h-2');
                        b.classList.add('w-5', 'h-5', '-top-2', '-right-2');
                    } else {
                        b.style.display = 'none';
                    }
                });
            })
            .catch(e => console.log('Error fetching notification count:', e));
    });
</script>
</body>
</html>
