<!-- 
TEMPLATE PURPOSE: 
This file is dynamically rendered by FastAPI using Jinja2. 
Variables inside double braces are passed directly from main.py.
Logic inside percent braces controls what the user sees based on their database state.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Learn & Grow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        html.dark { filter: invert(1) hue-rotate(180deg); background: #0a0a0a; }
        html.dark img, html.dark video { filter: invert(1) hue-rotate(180deg); }
    </style>

</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans text-gray-800">

<div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-md">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-extrabold text-gray-900">Edit Profile</h2>
        <a href="/profile" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-2xl"></i></a>
    </div>

    <form action="/edit_profile" method="POST" class="space-y-6">
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
            <div class="relative">
                <i class="fa-regular fa-user absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" name="name" value="{{ user.name }}" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
            <div class="relative">
                <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-gray-400"></i>
                <input type="email" name="email" value="{{ user.email }}" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label>
            <div class="relative">
                <i class="fa-solid fa-phone absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" name="phone_number" value="{{ user.phone_number }}" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">New Password (Optional)</label>
            <div class="relative">
                <i class="fa-solid fa-lock absolute left-4 top-3.5 text-gray-400"></i>
                <input type="password" name="password" placeholder="Leave blank to keep current" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-md mt-4">
            Save Changes
        </button>
        
        <div class="mt-6 border-t border-gray-100 pt-6 flex flex-col space-y-3">
            <a href="/logout" class="flex items-center text-red-500 hover:text-red-700 transition">
                <i class="fa-solid fa-arrow-right-from-bracket w-6 text-center mr-2"></i> Log Out
            </a>
        </div>
    </form>
</div>


<!-- Auto-updating Notification Badge -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/api/unread-count')
            .then(r => r.json())
            .then(data => {
                const bells = document.querySelectorAll('a[href="/notifications"] span.bg-red-500');
                bells.forEach(b => {
                    if(data.count > 0) {
                        b.style.display = 'flex';
                        b.style.alignItems = 'center';
                        b.style.justifyContent = 'center';
                        b.style.fontSize = '10px';
                        b.style.color = 'white';
                        b.style.fontWeight = 'bold';
                        b.innerText = data.count > 9 ? '9+' : data.count;
                        b.classList.remove('w-2.5', 'h-2.5', 'w-2', 'h-2');
                        b.classList.add('w-5', 'h-5', '-top-2', '-right-2');
                    } else {
                        b.style.display = 'none';
                    }
                });
            })
            .catch(e => console.log('Error fetching notification count:', e));
    });
</script>
</body>
</html>
