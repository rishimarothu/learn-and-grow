<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Student Resource Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Nunito', sans-serif; background-color: #f3f6fb; }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    
    <!-- Top Bar -->
    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center shrink-0">
        <a href="/dashboard" class="flex items-center text-gray-500 hover:text-indigo-600 transition">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Dashboard
        </a>
        <div class="font-bold text-lg text-gray-800"><i class="fa-solid fa-gear text-indigo-500 mr-2"></i> Settings</div>
    </header>
    
    <main class="flex-1 w-full max-w-4xl mx-auto p-8">
        <h1 class="text-3xl font-black text-gray-800 mb-2">Settings</h1>
        <p class="text-gray-500 mb-8">Manage your account preferences and settings.</p>

        <div class="space-y-4">
            
            <a href="/notifications" class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center hover:shadow-md hover:border-indigo-200 transition group cursor-pointer">
                <div class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center text-xl mr-4 group-hover:scale-110 transition">
                    <i class="fa-regular fa-bell"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-lg font-bold text-gray-800 mb-1">Notifications</h3>
                    <p class="text-sm text-gray-500">View your notifications and alerts</p>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-300 group-hover:text-indigo-400"></i>
            </a>

            <a href="/profile" class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center hover:shadow-md hover:border-indigo-200 transition group cursor-pointer">
                <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center text-xl mr-4 group-hover:scale-110 transition">
                    <i class="fa-regular fa-user"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-lg font-bold text-gray-800 mb-1">Account Profile</h3>
                    <p class="text-sm text-gray-500">Edit your profile details</p>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-300 group-hover:text-indigo-400"></i>
            </a>

        </div>
    </main>
<!-- Auto-updating Notification Badge -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/api/unread-count')
            .then(r => r.json())
            .then(data => {
                const bells = document.querySelectorAll('a[href="/notifications"] span.bg-red-500');
                bells.forEach(b => {
                    if(data.count > 0) {
                        b.style.display = 'flex';
                        b.style.alignItems = 'center';
                        b.style.justifyContent = 'center';
                        b.style.fontSize = '10px';
                        b.style.color = 'white';
                        b.style.fontWeight = 'bold';
                        b.innerText = data.count > 9 ? '9+' : data.count;
                        b.classList.remove('w-2.5', 'h-2.5', 'w-2', 'h-2');
                        b.classList.add('w-5', 'h-5', '-top-2', '-right-2');
                    } else {
                        b.style.display = 'none';
                    }
                });
            })
            .catch(e => console.log('Error fetching notification count:', e));
    });
</script>
</body>
</html>
